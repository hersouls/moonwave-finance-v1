  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script>
    // Prevent theme FOUC: apply dark class + color palette before React renders
    try {
      var s = JSON.parse(localStorage.getItem('finance-settings') || '{}');
      var st = s && s.state && s.state.settings;
      var t = st && st.theme;
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme:dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      // v4 "One Purple": 브랜드 보라가 CSS @theme 베이스 — data-palette 불필요
      if (st && st.oledMode) document.documentElement.setAttribute('data-oled', 'true');
    } catch(e) {}
  </script>
